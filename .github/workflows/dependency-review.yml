name: Dependency Review

# Bloquea un PR que **introduce** una dependencia con vulnerabilidad conocida
# o con una licencia copyleft fuerte (OWASP A03:2025; ISO 27001 A.8.8 y
# A.5.32 derechos de propiedad intelectual). Mira solo el diff de
# dependencias del PR (pubspec.lock, requirements*.lock, actions), así que es
# complementario a osv-scanner, que escanea todo el árbol.
#
# Licencias: docs/08 §3 ya descartó reutilizar código GPL de QField para no
# arrastrar copyleft sobre VisitaCampo; esta lista lo aplica a dependencias.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependencias nuevas (CVE + licencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Las licencias de pub llegan en minúsculas y la acción no las
          # reconoce como SPDX (ni casaría un GPL en minúsculas con la lista
          # de prohibidas): la política de licencias la aplica el paso
          # siguiente, sin distinguir mayúsculas.
          license-check: false

      - name: licencias de las dependencias nuevas
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tool/check_new_licenses.py "$REPO" "$BASE_SHA" "$HEAD_SHA"
